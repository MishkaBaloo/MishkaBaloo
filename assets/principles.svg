</defs><clipPath id="cp"><rect width="1000" height="260" rx="32"/></clipPath><g clip-path="url(#cp)"><rect width="1000" height="260" fill="#07070d"/><circle cx="500" cy="130" r="160" fill="#5E5CE6" opacity="0.6" filter="url(#b60)"><animateTransform attributeName="transform" type="translate" values="0 0;60 20;-30 -20;0 0" dur="13s" begin="-0s" repeatCount="indefinite"/></circle><circle cx="90" cy="74" r="52" fill="#FF375F" filter="url(#b25)" opacity=".75"/><rect x="30" y="30" width="300" height="200" rx="34" fill="url(#gf)" filter="url(#sh)"/><rect x="33" y="33" width="294" height="100" rx="31" fill="url(#sv)" opacity=".45"/><rect x="30" y="30" width="300" height="200" rx="34" fill="none" stroke="url(#gs)" stroke-width="1.5"/><rect x="34" y="34" width="292" height="192" rx="30" fill="none" stroke="url(#gr)" stroke-width="1"/><text x="58" y="100" font-size="36">🎨</text><text x="58" y="142" font-size="21" font-weight="700" fill="#fff">Design-minded</text><text x="58" y="172" font-size="14" fill="#fff" opacity=".72">Interfaces that feel native,</text><text x="58" y="194" font-size="14" fill="#fff" opacity=".72">fluid and intentional — down</text><text x="58" y="216" font-size="14" fill="#fff" opacity=".72">to the last pixel.</text><circle cx="410" cy="74" r="52" fill="#64D2FF" filter="url(#b25)" opacity=".75"/><rect x="350" y="30" width="300" height="200" rx="34" fill="url(#gf)" filter="url(#sh)"/><rect x="353" y="33" width="294" height="100" rx="31" fill="url(#sv)" opacity=".45"/><rect x="350" y="30" width="300" height="200" rx="34" fill="none" stroke="url(#gs)" stroke-width="1.5"/><rect x="354" y="34" width="292" height="192" rx="30" fill="none" stroke="url(#gr)" stroke-width="1"/><text x="378" y="100" font-size="36">⚡</text><text x="378" y="142" font-size="21" font-weight="700" fill="#fff">Performance-first</text><text x="378" y="172" font-size="14" fill="#fff" opacity=".72">Smooth scrolling, fast launch,</text><text x="378" y="194" font-size="14" fill="#fff" opacity=".72">lean memory. Measured with</text><text x="378" y="216" font-size="14" fill="#fff" opacity=".72">Instruments, not guessed.</text><circle cx="730" cy="74" r="52" fill="#30D158" filter="url(#b25)" opacity=".75"/><rect x="670" y="30" width="300" height="200" rx="34" fill="url(#gf)" filter="url(#sh)"/><rect x="673" y="33" width="294" height="100" rx="31" fill="url(#sv)" opacity=".45"/><rect x="670" y="30" width="300" height="200" rx="34" fill="none" stroke="url(#gs)" stroke-width="1.5"/><rect x="674" y="34" width="292" height="192" rx="30" fill="none" stroke="url(#gr)" stroke-width="1"/><text x="698" y="100" font-size="36">🧱</text><text x="698" y="142" font-size="21" font-weight="700" fill="#fff">Clean by default</text><text x="698" y="172" font-size="14" fill="#fff" opacity=".72">Modular, testable code that</text><text x="698" y="194" font-size="14" fill="#fff" opacity=".72">stays easy to read and easy</text><text x="698" y="216" font-size="14" fill="#fff" opacity=".72">to change.</text></g></svg>