nt-size="12" font-weight="700" fill="#fff">02</text><text x="378" y="128" font-size="20" font-weight="700" fill="#fff">Performance-first</text><text x="378" y="158" font-size="14" fill="#fff" opacity=".7">Smooth scrolling, fast launch</text><text x="378" y="180" font-size="14" fill="#fff" opacity=".7">and lean memory, measured</text><text x="378" y="202" font-size="14" fill="#fff" opacity=".7">with Instruments.</text><circle cx="714" cy="76" r="30" fill="#2DD4BF" filter="url(#b25)" opacity=".4"/><rect x="668" y="32" width="300" height="200" rx="24" fill="url(#gf)"/><rect x="670" y="34" width="296" height="110" rx="22" fill="url(#sv)" opacity=".35"/><rect x="668.5" y="32.5" width="299" height="199" rx="23.5" fill="none" stroke="url(#gs)" stroke-width="1.2"/><circle cx="714" cy="76" r="18" fill="#fff" fill-opacity=".10" stroke="#fff" stroke-opacity=".35"/><text x="714" y="81" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">03</text><text x="696" y="128" font-size="20" font-weight="700" fill="#fff">Clean by default</text><text x="696" y="158" font-size="14" fill="#fff" opacity=".7">Modular, testable code that</text><text x="696" y="180" font-size="14" fill="#fff" opacity=".7">stays easy to read and easy</text><text x="696" y="202" font-size="14" fill="#fff" opacity=".7">to change.</text></g><rect x=".5" y=".5" width="999" height="263" rx="31.5" fill="none" stroke="#fff" stroke-opacity=".10"/></svg>